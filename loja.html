<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurar loja - ShopThur</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 450px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
      color: #FFD700;
    }

    label {
      display: block;
      margin-top: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    textarea {
      height: 100px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      background: #FFD700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Configure sua loja</h1>

  <p>Preencha as informações para começar a vender no ShopThur.</p>
<label>Logo ou foto da loja</label>
<input type="file">
  <label>Nome da loja</label>
  <input type="text" placeholder="Ex: Loja do Cauã">

  <label>O que você vende?</label>
  <input type="text" placeholder="Ex: Roupas, eletrônicos, alimentos">

  <label>Cidade</label>
  <input type="text" placeholder="Digite sua cidade">

  <label>WhatsApp para contato</label>
  <input type="tel" placeholder="(00) 00000-0000">

  <label>Descrição da loja</label>
  <textarea placeholder="Fale um pouco sobre sua loja"></textarea>

  <button>
    <a href="produto.html">Salvar minha loja</a>
  </button>

</div>

</body>
</html>
