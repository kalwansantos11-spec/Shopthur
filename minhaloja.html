<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja - ShopThur</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .loja {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .capa {
      height: 150px;
      background: #FFD700;
    }

    .perfil {
      text-align: center;
      padding: 20px;
    }

    .logo {
      width: 100px;
      height: 100px;
      background: #ddd;
      border-radius: 50%;
      margin: -70px auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      margin: 10px 0;
    }

    .info {
      color: #555;
    }

    .whatsapp {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 25px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .produtos {
      padding: 20px;
    }

    .produto {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .produto h3 {
      margin: 0;
    }

    .preco {
      color: #333;
      font-weight: bold;
    }
  </style>

</head>

<body>

<div class="loja">

  <div class="capa"></div>

  <div class="perfil">

    <div class="logo">
      🏪
    </div>

    <h1>Nome da Loja</h1>

    <p class="info">
      📍 Cidade da loja
    </p>

    <p>
      Descrição da loja aparecerá aqui.
    </p>

    <a class="whatsapp" href="#">
      Falar no WhatsApp
    </a>

  </div>


  <div class="produtos">

    <h2>Produtos</h2>

    <div class="produto">
      <h3>Nome do produto</h3>
      <p>Descrição do produto.</p>
      <p class="preco">R$ 0,00</p>
    </div>

  </div>

</div>

</body>
</html>
