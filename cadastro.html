<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta ShopThur</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 400px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      color: #FFD700;
    }

    label {
      display: block;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #FFD700;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Criar conta ShopThur</h1>

    <form>
      <label>Nome</label>
      <input type="text" placeholder="Digite seu nome">

      <label>E-mail</label>
      <input type="email" placeholder="Digite seu e-mail">

      <label>Senha</label>
      <input type="password" placeholder="Crie uma senha">

      <label>Confirmar senha</label>
      <input type="password" placeholder="Repita sua senha">

      <a href="sucesso.html">
  <button type="button">Criar conta</button>
</a>
    </form>
  </div>

</body>
</html>
